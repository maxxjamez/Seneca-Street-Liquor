<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <!-- TAB TITLE -->
  <title>The Best Liquor on Seneca Street</title>

  <!-- SEO -->
  <meta
    name="description"
    content="The Best Liquor on Seneca Street. Seneca Street Liquor in Wichita, Kansas. Pre-save the song and pre-order the 7 inch vinyl."
  >

  <meta
    name="keywords"
    content="Seneca Street Liquor, Wichita Kansas, Seneca Street, liquor store Wichita, Seneca Street Liquor song, MAXXJAMEZ"
  >

  <meta name="author" content="MAXXJAMEZ">

  <!-- iMESSAGE / SOCIAL LINK PREVIEW -->
  <meta
    property="og:title"
    content="The Best Liquor on Seneca Street"
  >

  <meta
    property="og:description"
    content="Pre-save the song. Pre-order the vinyl. Visit Seneca Street Liquor."
  >

  <meta
    property="og:image"
    content="https://senecastreetliquor.com/store-info-transparent.png"
  >

  <meta

    content="https://senecastreetliquor.com/"
  >

  <meta

    content="website"
  >

  <meta
    name="twitter:card"
    content="summary_large_image"
  >

  <meta
    name="twitter:title"
    content="The Best Liquor on Seneca Street"
  >

  <meta
    name="twitter:description"
    content="Pre-save the song. Pre-order the vinyl. Visit Seneca Street Liquor."
  >

  <meta
    name="twitter:image"
    content="https://senecastreetliquor.com/store-info-transparent.png"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;
      background: #d3d3d3;
      color: #000;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    .site {
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
      padding: 20px;
    }

    /* HEADER */

    header {
      padding: 25px 0 20px;
    }

    .tagline {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .hero-box {
      background: rgba(0, 0, 0, 0.20);
      border: 2px solid #777;
      padding: 0;
      overflow: hidden;
    }

    .hero-image {
      width: 100%;
      height: auto;
      display: block;
    }

    /* NAVIGATION */

    nav {
      padding: 25px 5px;
      border-bottom: 3px solid #888;
    }

    nav a {
      color: #0000bb;
      font-weight: bold;
      font-size: 18px;
      text-decoration: underline;
    }

    nav span {
      padding: 0 12px;
      font-weight: bold;
    }

    /* SECTIONS */

    .section {
      margin-top: 32px;
      padding: 25px 22px;
      background: #c8c8c8;
      border-top: 4px solid #fff;
      border-left: 4px solid #fff;
      border-right: 5px solid #666;
      border-bottom: 5px solid #666;
    }

    .section h2 {
      margin: 0 0 22px;
      font-size: 42px;
      line-height: 1;
      font-weight: 900;
      text-transform: uppercase;
    }

    /* PRE-SAVE */

    .presave-frame {
      width: 100%;
      height: 760px;
      border: 3px solid #000;
      background: #000;
      display: block;
    }

    /* IMAGES */

    .vinyl-image {
      display: block;
      width: 100%;
      height: auto;
      background: #000;
      border: 3px solid #000;
      margin-bottom: 22px;
    }

    /* BUTTONS */

    .button {
      display: block;
      width: 100%;
      padding: 25px 15px;
      background: #ccc;
      color: #0000bb;
      font-size: 30px;
      font-weight: 900;
      text-decoration: underline;
      border-top: 4px solid #fff;
      border-left: 4px solid #fff;
      border-right: 5px solid #555;
      border-bottom: 5px solid #555;
      cursor: pointer;
    }

    .button:active {
      border-top: 5px solid #555;
      border-left: 5px solid #555;
      border-right: 4px solid #fff;
      border-bottom: 4px solid #fff;
    }

    .coming-soon {
      margin: 18px 0 0;
      font-size: 18px;
      text-transform: uppercase;
    }

    /* STORE */

    .store-name {
      font-size: 28px;
      font-weight: 900;
      margin: 20px 0 10px;
    }

    .store-address {
      font-size: 25px;
      font-weight: 900;
      line-height: 1.5;
      text-transform: uppercase;
    }

    .phone {
      display: inline-block;
      margin-top: 5px;
      color: #0000bb;
      font-size: 28px;
      font-weight: 900;
      text-decoration: underline;
    }

    /* MAP */

    .map {
      width: 100%;
      height: 400px;
      border: 3px solid #000;
      margin-top: 25px;
    }

    /* FOOTER */

    footer {
      margin-top: 45px;
      padding: 35px 10px 60px;
      border-top: 3px solid #777;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* MOBILE */

    @media (max-width: 600px) {

      .site {
        padding: 18px;
      }

      .tagline {
        font-size: 15px;
      }

      .section {
        padding: 20px;
      }

      .section h2 {
        font-size: 34px;
      }

      .button {
        font-size: 25px;
        padding: 22px 10px;
      }

      .presave-frame {
        height: 760px;
      }

      .store-name {
        font-size: 25px;
      }

      .store-address {
        font-size: 23px;
      }

      nav a {
        font-size: 16px;
      }

      nav span {
        padding: 0 7px;
      }

    }

  </style>
</head>


<body>

  <div class="site">

    <!-- ========================= -->
    <!-- HEADER -->
    <!-- ========================= -->

    <header>

      <div class="tagline">
        THE BEST LIQUOR ON SENECA STREET
      </div>

      <div class="hero-box">

        <img
          class="hero-image"
          src="store-info-transparent.png"
          alt="Seneca Street Liquor Wichita Kansas"
        >

      </div>

    </header>


    <!-- ========================= -->
    <!-- NAV -->
    <!-- ========================= -->

    <nav>

      <a href="#presave">
        SONG PRE-SAVE
      </a>

      <span>|</span>

      <a href="#vinyl">
        VINYL
      </a>

      <span>|</span>

      <a href="#store">
        STORE
      </a>

    </nav>


    <!-- ========================= -->
    <!-- SONG PRE-SAVE -->
    <!-- ========================= -->

    <section
      class="section"
      id="presave"
    >

      <h2>
        PRE-SAVE THE SONG
      </h2>


      <!-- HYPEDDIT EMBED -->

      <iframe
        class="presave-frame"
        src="https://hypeddit.com/hhs1ou"
        title="Seneca Street Liquor Song Pre-Save"
        loading="lazy"
        allow="clipboard-write"
      ></iframe>


      <br>


      <a
        class="button"
        href="https://hypeddit.com/hhs1ou"
        target="_blank"
        rel="noopener noreferrer"
      >
        OPEN PRE-SAVE PAGE
      </a>

    </section>


    <!-- ========================= -->
    <!-- VINYL -->
    <!-- ========================= -->

    <section
      class="section"
      id="vinyl"
    >

      <h2>
        GET IT ON VINYL
      </h2>


      <img
        class="vinyl-image"
        src="seneca-vinyl-record.PNG"
        alt="Seneca Street Liquor 7 inch vinyl record"
      >


      <!-- VINYL PRE-ORDER BUTTON -->

      <a
        class="button"
        href="https://tinasllc.bigcartel.com/product/seneca-street-liquor-vinyl"
        target="_blank"
        rel="noopener noreferrer"
      >
        PRE-ORDER VINYL
      </a>


      <p class="coming-soon">
        7" VINYL AVAILABLE FOR PRE-ORDER
      </p>

    </section>


    <!-- ========================= -->
    <!-- STORE -->
    <!-- ========================= -->

    <section
      class="section"
      id="store"
    >

      <h2>
        THE ACTUAL<br>
        STORE
      </h2>


      <div class="store-name">
        SENECA STREET LIQUOR
      </div>


      <div class="store-address">

        403 N SENECA ST.<br>

        WICHITA, KS 67203

      </div>


      <a
        class="phone"
        href="tel:3162652676"
      >
        (316) 265-2676
      </a>


      <!-- GOOGLE MAP -->

      <iframe
        class="map"
        src="https://www.google.com/maps?q=403+N+Seneca+St,+Wichita,+KS+67203&output=embed"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
        title="Seneca Street Liquor Google Map"
      ></iframe>

    </section>


    <!-- ========================= -->
    <!-- FOOTER -->
    <!-- ========================= -->

    <footer>

      THE BEST LIQUOR ON SENECA STREET

    </footer>

  </div>

</body>

</html>
